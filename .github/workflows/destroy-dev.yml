# Elimina el entorno dev del laboratorio 09. Se lanza a mano desde la pestaña Actions,
# solo sobre la rama development y con el mismo entorno dev (y su aprobación).
name: Destroy dev

run-name: ${{ github.actor }} elimina lab09 de dev

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: lab09-dev
  cancel-in-progress: false

jobs:
  destroy:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Credenciales AWS por OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.5

      - name: Terraform init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=lab09/dev/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Terraform destroy
        run: terraform destroy -input=false -auto-approve -var="region=${{ vars.AWS_REGION }}"
